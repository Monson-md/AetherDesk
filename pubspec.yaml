name: aetherdesk
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # Real (non-simulated) local capabilities — see CLAUDE.md's "Hard
  # constraints" for the Étape 1 real-only directive. Kept on recent major
  # versions deliberately: this project's Android toolchain (AGP 9.0.1) is
  # new enough that older federated plugin implementations (e.g.
  # local_auth_android 1.x, pre-10.x flutter_secure_storage) fail to build.
  flutter_secure_storage: ^10.3.1 # encrypted key/value store (Vault master key)
  local_auth: ^3.0.2 # real biometric/PIN gate
  cryptography: ^2.7.0 # real AES-GCM encryption for the Vault
  shared_preferences: ^2.3.2 # real local persistence (Project Management)
  file_picker: ^11.0.3 # real file open/save (Code Editor)

  # Étape 2: real Firebase (Auth, Firestore, FCM, Remote Config only — no
  # Storage, which requires the paid Blaze plan). Firebase.initializeApp()
  # reads android/app/google-services.json directly (Android-only app, so
  # no need for a hand-rolled firebase_options.dart) — see main.dart and
  # android/app/build.gradle.kts for the Google Services Gradle plugin.
  firebase_core: ^4.4.1
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.1.1
  firebase_messaging: ^16.0.6
  firebase_remote_config: ^6.1.1

  # Étape 2: free GitHub Releases-based update checker (public API, no
  # account/token needed) — see core/services/updates/.
  http: ^1.6.0
  url_launcher: ^6.3.1

  # Étape 3, batch 1: real device tools in cyber_workspace's new "Device"
  # tab — no external hardware needed for any of these.
  sensors_plus: ^7.0.0 # accelerometer/gyroscope/magnetometer dashboard
  torch_light: ^1.1.0 # real flashlight control
  mobile_scanner: ^7.1.2 # real camera QR/barcode scanning
  qr_flutter: ^4.1.0 # real QR code generation (pure Dart, no native code)
  flutter_blue_plus: ^1.36.5 # real BLE device scanner

  # Étape 3, batch 2: hardware-adjacent real device tools. geolocator/
  # nfc_manager use only the phone's own built-in radios (no external
  # hardware); usb_serial is the one genuine external-hardware integration
  # (Arduino/ESP32 over a real USB-OTG cable).
  geolocator: ^14.0.2 # real device GPS (no paid IP-geolocation API)
  nfc_manager: ^4.2.1 # real NFC tag/badge UID reader (read-only audit)
  usb_serial: ^0.5.2 # real USB-serial link to an external microcontroller

  # Creation 3D: a real (hand-rolled, pure Dart) 3D renderer — real mesh
  # generation, model/view/projection matrices and per-face Lambertian
  # shading via `vector_math`, painted with CustomPainter. No native/OpenGL
  # plugin needed, which also sidesteps this project's AGP-toolchain
  # fragility (see the Étape 1 CI notes above).
  vector_math: ^2.2.0

  # Settings' real storage-usage figure and user_profile's real avatar
  # photo (copied into the app's own private storage) — reuses the
  # existing file_picker for image selection rather than adding a second
  # picker plugin.
  path_provider: ^2.1.6
  flutter_highlighting: ^0.9.0+11.8.0
  highlighting: ^0.9.0+11.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Enables `flutter gen-l10n` code generation from lib/l10n/*.arb files,
  # driven by the l10n.yaml configuration at the project root.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Asset folders reserved for future content. Each contains a .gitkeep
  # placeholder so the empty directory is tracked by git until real
  # assets are added.
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
